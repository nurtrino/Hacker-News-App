name: Build HackerNews APK

# Builds the Android client and publishes an installable APK. Android has no
# Signulous step — the APK is signed here (with the debug key unless a real
# keystore is configured) and can be sideloaded directly.

on:
  push:
    branches:
      - hacker-news-app
    paths:
      - 'HackerNewsAndroid/**'
      - '.github/workflows/build-hackernews-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    defaults:
      run:
        working-directory: HackerNewsAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Show toolchain
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # A real keystore is used when these secrets are set; otherwise the
      # release build falls back to the debug key, which still installs.
      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the configured release keystore."
          else
            echo "No keystore secret set; the release build falls back to the debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Stage the APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            find app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/HackerNews.apk"
          ls -lh "$GITHUB_WORKSPACE/HackerNews.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackerNews-apk
          path: HackerNews.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish into the combined release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Hacker News — latest build" \
              --prerelease \
              --notes "iOS and Android builds of the Hacker News client.

          - \`HackerNews-unsigned.ipa\` — unsigned; sign it with your own
            certificate (Signulous, ESign, Sideloadly, \`codesign\`).
          - \`HackerNews.apk\` — signed and installable as-is.

          Bundle / application id is \`com.nurtrino.hackernews\`; no entitlements
          are required." || true
          gh release upload "$TAG" HackerNews.apk --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/HackerNews.apk"
