name: Build HackerNews APK

# Builds the Android client and publishes an installable APK. Android has no
# Signulous step — the APK is signed here (with the debug key unless a real
# keystore is configured) and can be sideloaded directly.

on:
  push:
    branches:
      - claude/hacker-news-ios-app-w4a6jl
    paths:
      - 'HackerNewsAndroid/**'
      - '.github/workflows/build-hackernews-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    defaults:
      run:
        working-directory: HackerNewsAndroid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Show toolchain
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # A real keystore is used when these secrets are set; otherwise the
      # release build falls back to the debug key, which still installs.
      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the configured release keystore."
          else
            echo "No keystore secret set; the release build falls back to the debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Stage the APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            find app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/HackerNews.apk"
          ls -lh "$GITHUB_WORKSPACE/HackerNews.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackerNews-apk
          path: HackerNews.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="hackernews-android-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" HackerNews.apk \
            --target "$GITHUB_SHA" \
            --title "Hacker News for Android — latest" \
            --prerelease \
            --notes "Android build of \`${GITHUB_SHA:0:7}\`.

          Download \`HackerNews.apk\` below and install it. You'll need to allow
          installs from your browser or file manager the first time.

          Signed with the CI debug key unless a release keystore is configured,
          so an update may ask you to uninstall the previous build first."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/HackerNews.apk"
