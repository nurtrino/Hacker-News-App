name: Build HackerNews IPA (unsigned)

# Builds the Hacker News client on a GitHub-hosted macOS runner and uploads an
# UNSIGNED .ipa as a workflow artifact. Signing is intentionally disabled so no
# certificates or secrets are needed — download the artifact and sign it with
# your own tooling (Signulous, ESign, Sideloadly, codesign, …).

on:
  push:
    branches:
      - hacker-news-app
    paths:
      - 'HackerNews/**'
      - 'HackerNews.xcodeproj/**'
      - '.github/workflows/build-hackernews-ipa.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned, Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project HackerNews.xcodeproj \
            -scheme HackerNews \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/HackerNews.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Build product not found at $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload HackerNews-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Store-compatible layout: Payload/ sits at the archive root.
          ditto -c -k --sequesterRsrc --keepParent Payload HackerNews-unsigned.ipa
          echo "Built unsigned IPA:"
          ls -lh HackerNews-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackerNews-unsigned-ipa
          path: HackerNews-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Artifacts are zipped by GitHub and can't be downloaded from the mobile
      # app at all. A release asset is the bare .ipa at a stable URL, which is
      # what a signing service actually wants.
      - name: Publish into the combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"
          # Both platform workflows publish into one release, so create it
          # only if the other job hasn't already.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Hacker News — latest build" \
              --notes "iOS and Android builds of the Hacker News client.

          - \`HackerNews-unsigned.ipa\` — unsigned; sign it with your own
            certificate (Signulous, ESign, Sideloadly, \`codesign\`).
          - \`HackerNews.apk\` — signed and installable as-is.

          Bundle / application id is \`com.nurtrino.hackernews\`; no entitlements
          are required." || true
          gh release upload "$TAG" HackerNews-unsigned.ipa --clobber
          gh release edit "$TAG" --prerelease=false --latest
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/HackerNews-unsigned.ipa"
